{% extends "base.html" %}{% block body %}
<h1 class="text-xl font-semibold mb-4">客户标签</h1>
{% if error %}
<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-4 text-sm">{{error}}</div>
{% endif %}
<form method="post" action="/admin/tags" class="bg-white rounded-xl p-4 shadow-sm mb-4 grid grid-cols-2 gap-2">
  <input name="name" placeholder="标签名（如 VIP）" class="border rounded px-3 py-2" required>
  <input name="group_name" placeholder="分组（可选，如 价值/来源）" class="border rounded px-3 py-2">
  <input name="color" placeholder="颜色（可选，如 #4f8cff）" class="border rounded px-3 py-2">
  <label class="flex items-center gap-2 text-sm text-slate-600 px-1">
    <input type="checkbox" name="ai_muted"> 打此标签的客户不自动回复（转人工）
  </label>
  <textarea name="description" placeholder="描述（会喂给 AI 做个性化，如「高价值老客户，优先照顾」）"
            rows="2" class="border rounded px-3 py-2 col-span-2"></textarea>
  <div class="col-span-2"><button class="bg-teal-600 text-white rounded px-4 py-2">新增标签</button></div>
</form>
<div class="bg-white rounded-xl shadow-sm divide-y">
  {% for t in tags %}
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full" style="background: {{ t.color or '#cbd5e1' }}"></span>
      <span class="font-medium">{{t.name}}</span>
      {% if t.group_name %}<span class="text-xs text-slate-400">{{t.group_name}}</span>{% endif %}
      {% if t.ai_muted %}<span class="text-xs bg-amber-100 text-amber-700 rounded px-1.5 py-0.5">AI静音</span>{% endif %}
      {% if t.description %}<span class="text-xs text-slate-400">— {{t.description}}</span>{% endif %}
    </div>
    <div class="flex items-center gap-3">
      <form method="post" action="/admin/tags/{{t.id}}/mute">
        <button class="text-slate-500 text-sm hover:underline">{{ '取消静音' if t.ai_muted else '设为AI静音' }}</button>
      </form>
      <form method="post" action="/admin/tags/{{t.id}}/delete"><button class="text-red-500 text-sm hover:underline">删除</button></form>
    </div>
  </div>
  {% else %}<div class="px-4 py-6 text-slate-400 text-sm">暂无标签</div>{% endfor %}
</div>
{% endblock %}
