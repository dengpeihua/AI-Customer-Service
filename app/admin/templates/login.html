<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>登录 · AI 客服后台</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
<form method="post" action="/admin/login" class="bg-white p-8 rounded-xl shadow w-80 space-y-3">
  <div class="font-bold text-teal-600 text-lg">管理后台登录</div>
  {% if error %}<div class="text-red-500 text-sm">{{error}}</div>{% endif %}
  <input name="tenant_id" value="1" placeholder="租户ID（一般填 1）" class="w-full border rounded px-3 py-2">
  <input name="login" placeholder="登录名" class="w-full border rounded px-3 py-2" required>
  <input name="password" type="password" placeholder="密码" class="w-full border rounded px-3 py-2" required>
  <button class="w-full bg-teal-600 text-white rounded px-3 py-2">登录</button>
</form></body></html>
