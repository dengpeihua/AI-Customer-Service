{% extends "base.html" %}{% block body %}
<a href="/admin/conversations" class="text-teal-600 text-sm">← 返回</a>
<h1 class="text-xl font-semibold my-3">{{conv.contact_id}} <span class="text-xs text-slate-400">{{conv.channel}} · {{conv.status}}</span></h1>
<div class="space-y-2 max-w-2xl">
  {% for m in msgs %}
  <div class="flex {{ 'justify-start' if m.direction=='in' else 'justify-end' }}">
    <div class="rounded-lg px-3 py-2 max-w-md {{ 'bg-slate-100' if m.direction=='in' else 'bg-teal-50' }}">
      <div class="text-xs text-slate-400">{{ {'customer':'客户','ai':'AI[自动]','agent':'人工'}.get(m.sender, m.sender) }}</div>
      <div>{{m.text}}</div>
    </div>
  </div>
  {% endfor %}
</div>
<div class="bg-white rounded-xl p-5 shadow-sm mt-6 max-w-md">
  <div class="font-medium mb-3">标记成交{% if deal %} <span class="text-xs text-teal-600">（已记录，可修改）</span>{% endif %}</div>
  <form method="post" action="/admin/conversations/{{conv.id}}/deal" class="space-y-3">
    <div><label class="text-sm text-slate-500">成交金额（元）</label>
      <input name="amount_yuan" type="number" step="0.01" min="0"
             value="{{ '%.2f'|format(deal.amount_cents/100) if deal else '' }}"
             class="w-full border rounded px-3 py-2"></div>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="is_followup"{% if deal and deal.is_followup %} checked{% endif %}> 跟进激活成交（沉睡客户被再触达后成交）</label>
    <div><label class="text-sm text-slate-500">备注</label>
      <input name="note" value="{{deal.note if deal else ''}}" class="w-full border rounded px-3 py-2"></div>
    <button class="bg-teal-600 text-white rounded px-4 py-2">保存成交</button>
  </form>
</div>
{% endblock %}
