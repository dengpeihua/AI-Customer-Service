services:
  salso-python:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: salso-python
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      LLM_STARTUP_API_KEY: ${LLM_STARTUP_API_KEY:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-salso123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-salso123}@redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      SALSO_SKILLS_DIR: /app/skills
    volumes:
      - salso-python-data:/app/data
      - ../backend/skills:/app/skills
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - salso-network

  redis:
    image: redis:7-alpine
    container_name: salso-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-salso123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - salso-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-salso123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: salso-chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - salso-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salso-frontend
    environment:
      PYTHON_API_URL: /api/python
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      salso-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - salso-network

  nginx:
    image: nginx:1.27-alpine
    container_name: salso-gateway
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      salso-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - salso-network

networks:
  salso-network:
    driver: bridge

volumes:
  redis-data:
  chromadb-data:
  salso-python-data:
