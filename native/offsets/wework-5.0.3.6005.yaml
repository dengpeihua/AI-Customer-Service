# 企业微信自研 hook —— 版本→内存偏移清单
#
# 路径 B 的最大长期维护成本集中在此：企微强绑定版本，升级即需重找偏移。
# 【骨架里程碑不使用任何 offset】——本文件此刻只确立结构。后续逆向阶段逐项填入。
#
# 复核偏移前务必先核对：装机后用 objdump/dumpbin 确认 WXWork.exe 位数与本文件 arch 一致。

target: 企业微信 (WXWork / WeCom)
version: "5.0.3.6005"
arch: x86                 # 32 位 —— 2026-07-25 装机后 objdump -f 复核确认 pei-i386（WXWork.exe 主进程 Wow64）
module: WXWork.exe
# 目标模块整文件 SHA-256（版本权威：官方 CDN 装的 WXWork.exe，防同版本号不同二进制/被替换）。
module_sha256: "3824da5b7038bd71e7a161a954db30c9808a2e3f7cb596fc5620c739e31d127a"
verified: false           # 版本/位数/sha256 已核；但【消息收发偏移】尚未逆向，故 has_message_offsets 仍 False

# 优先用特征码(AOB)定位而非裸 RVA —— 抗小版本/重定位漂移，减轻升级维护。
#
# ── WIP（2026-07-26 Ghidra 完整分析 静态逆向；AOB 唯一性已校验，但字段偏移/
#        收发语义未经真机动态确认 → verified:false，勿激活）─────────────────
# AOB 生成方法：Ghidra headless 完整分析(1.28M 函数)后，对函数入口取前 32 字节，
#   用 PE 重定位表把每个会随 ASLR 漂移的 dword 通配为 ??，再全 .text 扫描确认唯一性
#   (matches==1)。故这些 AOB 在【运行时重定位后的镜像】里同样能匹配。
#   工具：D:\re-tools\ghidra-scripts\{DecompileContaining,MapLogStrings,MakeAOB,...}.java
#   全文：docs/wecom-ghidra-session-2026-07-26.md
signatures:
  # ★★ 收 · 读取消息 hook 点 —— 2026-07-26【真机 inline hook 实测捕获成功】★★
  # FUN_01b9f7e1 = FTS 索引记录处理器(消息收到后近实时索引时被调,thiscall)。
  # 在此 inline hook,遍历记录即可拿到每条消息的明文字段。已注入活企微 hook 到、
  # 捕获真实入站消息("ZZFINAL")、干净摘钩、企微存活——全流程验证通过。
  # 调用约定/遍历:ECX=this；arr=*this；start=arr[0]；end=arr[1]；
  #   每条 record=*(uint*)p，p 从 start 到 end 步长 8。
  # 记录字段(record 相对偏移，MSVC std::string 布局 buf@off/size@off+0x10/cap@off+0x14):
  #   +0x08 = 文本正文 (std::string)   ← 实测 "ZZFINAL\n"
  #   +0x50 = 发件人 userid (std::string) ← 实测 "7881303268160321"(=对方=客户)
  #   +0x68 = 类型串(实测 "60")；+0x80/+0x90 = 更多串(会话/msgid)
  #   会话 id 可由 sender 推出:1:1 = "sAS:<自己uid>_<sender_uid>"
  # hook 装载:偷 7 字节(6A 78 push + B8 imm32 mov,均位置无关)；装前只读校验
  #   目标处 6A 78 B8 ?? ?? ?? ?? E8(exact-RVA,非全局唯一 AOB→生产用 RVA+序言校验)。
  # 过滤:sender==自己 uid 即为发出消息,丢弃(只留入站)。
  recv_read_hook:
    func: FUN_01b9f7e1
    rva: 0x0179F7E1
    module: WXWork.exe
    calling_conv: thiscall
    hook_stolen_len: 7
    prologue_verify: "6A 78 B8 ?? ?? ?? ?? E8"
    record_fields:
      text:          { off: 0x08, type: std_string }
      sender_userid: { off: 0x50, type: std_string }
      subtype:       { off: 0x68, type: std_string }
    conversation_id_formula: "sAS:<self_uid>_<sender_userid>   # 1:1"
    verified: true       # 2026-07-26 真机 inline hook 捕获实测通过
    verified_note: "注入 wecom_capture.dll → ih_install 7B → 捕获真实入站消息字段 → ih_remove 干净摘钩 → 企微存活"

  # 发送 · UI compose 处理函数（读输入框 CDuiString::GetData 后解析/派发）。
  # thiscall，[this+0xB4]=输入控件对象，GetText=vtable+0x48。这是 UI 侧发送处理，
  # 不是可编程 Send(conv,text)——发送路径深层是 PostSendMessageTask2（见下）。
  send_ui_handler:
    aob: "68 AC 00 00 00 B8 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B D9 8B 8B B4 00 00 00 33 D2 89 4D A0 85 C9 75 07"
    rva: 0x03330E2A
    module: WXWork.exe
    calling_conv: thiscall
    unique_in_text: true
    verified: false

  # 收 · SyncAppMsgsTask::FetchFinish —— 消息同步 CGI 返回后处理入站消息【批次】。
  # param_1=task(this via ecx 也用)，param_2=同步响应；msglist_size=*(param_2+0x14)，
  # msg 数组=*(param_2+0x1c)，循环对每条调 recv_webmsg_parser。是稳定的收侧总入口。
  recv_fetchfinish:
    aob: "68 6C 01 00 00 B8 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B D9 8B 7D 08 8B 75 0C 89 75 EC 68 ?? ?? ?? ?? 80"
    rva: 0x050E06A0
    module: WXWork.exe
    calling_conv: thiscall
    unique_in_text: true
    verified: false

  # 收 · CRTX::WebMsg 解析构造器（per-message）。入口 EH_prolog3 通用序言 → 32B AOB
  # 不唯一(80 处)，需用 recv_fetchfinish 当锚点经 CALL 到达，或延长签名。此处只记 RVA。
  recv_webmsg_parser:
    rva: 0x0140BE3B
    module: WXWork.exe
    calling_conv: thiscall
    unique_in_text: false           # 32B 不唯一；勿单独用 AOB 定位
    verified: false

  # 发 · 机制摸清（2026-07-26 真机动态捕获，尚未实装发送）：
  # send_ui_handler(FUN_03730e2a) 与其后的 FUN_037a17dc(RVA 0x33A17DC, thiscall) =
  # 「读输入框→构造→发送」，与输入框强耦合。UI compose 触发链:
  #   FUN_037a178e(RVA 0x33A178E,回车处理)→FUN_03730e2a(处理@)→FUN_037a17dc(发送)。
  # 聊天视图 this 布局:this+0x90 = 当前会话 id 字符串(发送层前缀 "S:<自uid>_<对方uid>"，
  #   注意与收侧 FTS 的 "sAS:" 前缀不同)；this+0xB4 = 输入控件(DuiLib CRichEditUI，
  #   GetText=vtable+0x48)。实测「孤星少将」uid=7881303268160321,
  #   会话 id="S:1688856447584453_7881303268160321"，自己 uid=1688856447584453。
  # 落地发送(待实装)=进程内:CRichEditUI::SetText(this+0xB4,文本)+触发 FUN_037a17dc(this)；
  #   缺 SetText vtable 槽位(需分析 DuiLib.dll)。programmatic 深层 SendMessageManager/
  #   PostSendMessageTask2 已确认不现实。self_uid=1688856447584453 供收侧过滤出站。
  send_ui_compose:
    ui_send_trigger:   { rva: 0x033A178E }   # 回车发送处理(thiscall this=聊天视图)
    ui_send_transmit:  { rva: 0x033A17DC }   # 读输入框构造+发送
    chatview_conv_off: 0x90                   # this+0x90 = 会话id "S:自_对方"(std::string,>15字符→堆指针; _Mysize@+0xA0)
    chatview_input_off: 0xB4                  # this+0xB4 = 输入控件(运行时 vtable 在 WXWork,子类化)
    chatview_flag_offs: [0x750, 0x758, 0x770] # 活动聊天视图时非空(FUN_037a17dc 前置读)
    self_uid: "1688856447584453"
    verified: true                            # 2026-07-26 真机程序化发送成功(见 send_LANDED)

  # ★★★ 发 · 程序化发送【真机打通】2026-07-26 ★★★ —— 给孤星少将发消息成功、企微存活。
  # 工具: native/wecom_hook/send_actuator_dll.c (编译=wsend.dll)。
  # 落地链(每步真机验证):
  #   1) 注入 wsend.dll → 进程内 HTTP 控制面(127.0.0.1)。
  #   2) 拿聊天视图 this: inline hook FUN_03730e2a(RVA 0x3330E2A, 偷5字节 68 AC 00 00 00,
  #      ECX=聊天视图)。用户在目标会话按一次回车即捕获 ECX。校验 +0x90 会话串==目标。
  #      ⚠️纯内存扫描定位 this 【不可行】:输入控件运行时 vtable 是 WXWork 子类 vtable(实测
  #        0x073xxxxx,在 WXWork 镜像内),≠ DuiLib 导出 vtable(0x509c5cf4/0x509e93c8);
  #        导出 vtable 值在企微堆里根本不出现 → 按导出 vtable 扫不到,按对象 vtable 槽 19 取
  #        SetText 会取到乱函数(0x061f0030)直接崩。故【必须 hook 捕获 this】。
  #   3) SetText 塞文本: 直调 DuiLib 导出 ?SetText@CRichEditUI@DuiLib@@UAEXPB_W@Z 的【实现地址】
  #      (GetProcAddress, ≈0x507b7120), thiscall(ecx=input, arg=const wchar_t*)。
  #      【不要】走对象自己 vtable 的槽位(子类 vtable 槽 18/19 是 WXWork 的 override,取错=崩)。
  #      UTF-8→UTF-16 用 MultiByteToWideChar(CP_UTF8)。
  #   4) 触发发送 = 【合成回车】: PostMessageW(WeWorkWindow, WM_KEYDOWN/WM_KEYUP, VK_RETURN)。
  #      企微跑它自然的回车→发送流程(会再次调 FUN_03730e2a=捕获钩再触发一次)→发出、输入框清空。
  #   跨线程: SetText 须在企微 UI 线程执行 → SetWindowsHookEx(WH_GETMESSAGE, uiTid) 把动作
  #      marshal 到 UI 线程(实测 ran_on_tid==uiTid)。PostMessage 回车任意线程可发。
  # 【实测无效/危险的直调路】(勿再走):
  #   - 直调 FUN_037a178e(this): 不崩但返回 0 不发 —— 程序化缺真实键盘/IME 前置(this+0x9bc/
  #     FUN_03781064/FUN_03730e2a 三条件之一不满足)。
  #   - 直调 FUN_037a17dc(this): 【崩】—— 依赖 FUN_03730e2a 先跑铺垫状态,跳过即崩。
  #   - 盲构造 Message + 调 Send(路①): 未实现 —— content子对象/会话/类型完整布局未逆全,极难。
  send_LANDED:
    method: "SetText(input, wtext) + synthetic Enter(PostMessage VK_RETURN to WeWorkWindow)"
    capture_this_hook: { rva: 0x3330E2A, stolen: 5, aob_head: "68 AC 00 00 00 B8", ecx: chatview }
    settext_export: "?SetText@CRichEditUI@DuiLib@@UAEXPB_W@Z"   # 直调导出实现,勿走对象 vtable 槽
    gettext_export: "?GetText@CRichEditUI@DuiLib@@UBE?AVCDuiString@2@XZ"  # vtable+0x48=slot18(导出布局)
    ui_thread_marshal: "SetWindowsHookEx(WH_GETMESSAGE, uiTid)"
    window_class: "WeWorkWindow"
    target_example: { peer_uid: "7881303268160321", conv: "S:1688856447584453_7881303268160321" }
    verified: true
    verified_note: "2026-07-26 给孤星少将真机程序化发送成功,消息入聊天记录,输入框清空,企微存活"

  # 发 · 无痕发送研究（2026-07-26 真机动态捕获 Message 结构；未实装，勿激活）：
  # 唯一发送入口(除UI)=wework::ui::InstantMessaging::Send = FUN_037a5638(RVA 0x33A5638,
  #   thiscall this=InstantMessaging, [esp+4]=&std::vector<std::shared_ptr<wework::model::Message>>)。
  #   仅被 FUN_037a17dc(UI compose)调用 → 这一层没有独立"干净 SendText(会话,文本)"。
