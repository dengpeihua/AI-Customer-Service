  # Message 对象(wework::model::Message)实测:顶层大部分空(一堆空 std::string，cap=0x0f)，
  #   **文本不在顶层**——在 Message+0x1B4 指向的 content 子对象里(实测 msgcap123 在该子对象 +~0x2c)。
  #   即 Message 是深度嵌套(content/会话/类型分散在嵌套结构+指针字段)。
  # ⇒ 无痕发送两条路(都需进程内 CALL 企微函数,首次写执行企微逻辑,崩险高):
  #   路①构造 Message: 进程内 new 出嵌套 Message(content子对象+会话+类型全填对)+调 Send。极难。
  #   路②GetText注入+触发(更可行): hook 输入控件 GetText(vtable+0x48)让其返回目标文本 →
