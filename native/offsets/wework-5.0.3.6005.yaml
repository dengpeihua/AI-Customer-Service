  #     输入框不动=无痕。需:活的聊天视图 this(会话须已加载)+构造 CDuiString+调企微函数。
  # 下一步(离机静态)=抠死 路②的 GetText hook 点/CDuiString 构造/触发时序,压真机试错次数。
  send_message_model:
    im_send_func:      { rva: 0x033A5638, note: "InstantMessaging::Send(this, vector<shared_ptr<Message>>)" }
    im_send_caller:    { rva: 0x033A17DC, note: "唯一调用者=UI compose" }
    vector_elem_size:  8            # shared_ptr<Message>
    msg_text_content_ptr_off: 0x1B4  # Message+0x1B4 → content 子对象(文本在其 +~0x2c)
    verified: false
    impl_paths: ["构造Message(极难)", "GetText注入+触发FUN_037a178e(可行,首选)"]

