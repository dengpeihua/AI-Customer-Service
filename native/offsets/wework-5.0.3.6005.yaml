  # ★★ 本地库 message.db 解密读取 —— 2026-07-28【真机 inline hook 收割解密明文成功】★★
  # 企微 message.db 用 WCDB 自研 cipher 加密（非标准 SQLCipher；密钥不驻留明文，外部解密走不通，
  # 见 docs/wecom-local-msgdb-re-plan.md 四点五/四点六）。改走"进程内被动收割"：企微进程内已把库
  # 解密打开，hook sqlite3_column_text 在企微读消息历史时截获每列解密后的明文——加密对我们等效失效。
  # Ghidra 反编译坐实 column_* 一家（imageBase 0x400000；旁证=WCDB 薄封装 FUN_006cddc0 依次调
  #   FUN_006cdb00→FUN_006ce8c0→FUN_00624740，签名(stmt,col)→uchar*）：
  #   column_text=0x224740  column_bytes=0x224800  column_double=0x2249C0
  #   column_int=0x224AA0   column_int64=0x224B60  VdbeExec=0x2638A0(step 执行核,二级锚,未上钩)
  # Vdbe 结果集布局：pResultSet=*(stmt+0x68)  nCol=*(u16)(stmt+0x8c)  Mem 步长0x28
  #   flags@+8(u16: MEM_Str=0x2/MEM_Blob=0x10)  enc@+0xa  z@+0x10  n@+0xc
  # 探针 native/wecom_hook/col_probe_dll.c：AOB 闸偷 6 字节；detour 全程无锁(避 HangMonitorV3 自杀)；
  #   GET /collog?since= 拉环形缓冲。真机 pid22256/基址0x9d0000 收割 809 列值，解出明文中文聊天消息
  #   (以上是打招呼内容 / 你已添加了孤星少将…)、消息 envelope(CAEQ clientmsgid + int64 svrid + 时间)、
  #   联系人(孤星少将)、CRM 看板。Python 解析层 widget/wecom/msgdb.py + 桥 fetch_collog + adapter
  #   harvest_history_texts()（反哺连接前历史+人工手打）。
  sqlite_column_text:
    func: FUN_00624740
    rva: 0x00224740
    module: WXWork.exe
    calling_conv: cdecl        # (sqlite3_stmt* stmt @[esp+4], int col @[esp+8]) -> const unsigned char*
    hook_stolen_len: 6
    prologue_verify: "55 8B EC 51 53 56 8B 75 08"
    vdbe_result_layout:
      pResultSet_off: 0x68
      nCol_off:       0x8c     # u16
      mem_stride:     0x28
      mem_flags_off:  0x08     # u16; MEM_Str=0x2 MEM_Blob=0x10
      mem_enc_off:    0x0a
      mem_z_off:      0x10
      mem_n_off:      0x0c
    family:                    # 同款 WCDB 薄封装可选加钩做行关联
      column_bytes:  0x00224800
      column_double: 0x002249C0
      column_int:    0x00224AA0
      column_int64:  0x00224B60
      vdbe_exec:     0x002638A0
    verified: true             # 2026-07-28 真机 inline hook 收割解密明文实测通过（只读/无锁/干净摘钩/企微存活）
    verified_note: "注入 col_probe.dll → ih_install 6B @0x224740 → /collog 收割 809 列值 → 解出明文聊天消息+envelope → 企微存活"

  # ★★★ 路线 B step3: 进程内自查读【全量】历史 —— 2026-07-28【真机跑通，读出全部结构化历史】★★★
  # 复用企微进程内已解密的 sqlite 连接，跑我们自己的只读 SELECT，得所有会话所有消息的
  # {conversation_id, sender_id, content_type, send_time, content} = 个人微信 QueryDB 式"开箱读全库"。
  # Ghidra 反编译 + 真机 SELECT 1 坐实（RVA imageBase 0x400000）：
  sqlite_self_query:
    # sqlite3LockAndPrepare(db,zSql,nByte,prepFlags,pReprepare,ppStmt,pzTail) —— 编译 SQL
    #   ★关键坑：混合约定★ ECX=db, EDX=sql, 5个栈参, 末尾【plain RET=调用方清栈】(非 fastcall 的被调清栈)。
    #   GCC __attribute__((fastcall)) 会按被调清栈→返回后 ESP 少 0x14→本地变量错位→崩。
    #   必须用裸 asm 桩：ECX/EDX 装前两参，右→左压 5 栈参，call，然后【调用方】addl $20 清栈。
    lock_and_prepare: { rva: 0x0025A9F0, conv: "ecx=db,edx=sql,+5栈参,调用方清栈" }
    prepare_inner:    { rva: 0x0025A400 }   # sqlite3Prepare(调 RunParser 0x27E8E0)，LockAndPrepare 内部调
    step:             { rva: 0x00223E30, conv: fastcall }  # sqlite3Step(stmt=ECX)->100=ROW/0x65=DONE；★须持 db mutex★
    finalize:         { rva: 0x00222FC0, conv: cdecl }     # sqlite3_finalize(stmt @[esp+4])
    column_text:      { rva: 0x00224740, conv: cdecl }     # 复用上面的 sqlite_column_text
    vdbe_exec:        { rva: 0x002269D0 }   # sqlite3VdbeExec（step 内部调；真 VdbeExec，非 0x2638A0）
    # sqlite3 结构关键偏移：
    vdbe_db_off:   0x00           # Vdbe->db = *(void**)stmt
    vdbe_magic_off: 0x14          # Vdbe magic：RESET=0x2df20da3 / RUN=0x319c2973（自查前校验 stmt 有效）
    vdbe_ncol_off: 0x8c           # *(u16*)(stmt+0x8c) = 列数（不必调 column_count）
    db_magic_off:  0x58           # sqlite3 magic：OPEN=0xA029A697（校验捕获的 db 句柄有效）
    db_mutex_off:  0x0c           # sqlite3->mutex（真机=0！WCDB 用 NOMUTEX 连接，见下）
    mutex_enter_fnptr_rva: 0x46DCC24   # 全局函数指针=sqlite3_mutex 的 xMutexEnter（列函数就这么调）
    mutex_leave_fnptr_rva: 0x46DCC2C
    schema:
      message_table: "message_table(message_id,server_id,sequence,sender_id,conversation_id,content_type,send_time,flag,content,...)"
      conv_id_1to1:  "S:<A>_<B>（1:1，self 可能在前或后，两序都要匹配）"
      text_content_pb: "content_type=2 的 content: 0A<n> 08 00 12<m> 0A<k> <UTF-8>（widget/wecom/msgdb.parse_text_content 解）"
    thread_safety_note: >
      db->mutex 真机=0（WCDB 用 SQLITE_OPEN_NOMUTEX 连接池，自己在池层串行化）。故 db_mtx 实为 no-op，
      自查在 bridge 线程跑=与企微 DB 线程无内建互斥。SELECT 1/schema/整段历史多次查询真机未崩（企微空闲时低争用），
      但这是残留风险；生产建议企微空闲时查 + 失败重试。若要更硬：marshal 到企微 DB 线程或找 WCDB 池锁。
    native: "native/wecom_hook/col_hook.c::col_hook_query（裸 asm call_prepare + db magic 校验 + SELECT-only + stmt magic 闸）"
    endpoints: "GET /wecom_dbs（列捕获句柄）+ POST /wecom_query{db,sql}（只读自查）"
    verified: true             # 2026-07-28 真机跑通：SELECT 1 → schema → message_table 全量 63 条 → 孤星少将 35 条结构化历史（我/客户+时间+正文），企微存活
    verified_note: "SELECT 1 先验约定(裸asm桩修好)→sqlite_master 找 message_table→读出全部测试消息(rxmark/ZZRECV/DEVDONE/恭喜已开发完成/headless已打通/3-2/1+1)"

# 收侧消息对象 CRTX::WebMsg 的字段布局（recv_webmsg_parser 逆出，dword 索引）：
#   [2]  = 原始 flags/type    *(param+8)
#   [4]/[5]/[6]/[7] = 四个 std::string 身份串 @对象偏移 0x10/0x14/0x18/0x1c
#        （条件置位，默认空串 &DAT_0aae3180）——企微语义=userid/external_userid/roomid 等，
#          【具体哪个是 文本/发件人/会话 未确认】，需真机动态断点看真消息。
#   [8]/[9]/[10] = 三个子对象 @0x20/0x24/0x28（文本正文很可能在其中之一）
#   [0xc..0xc+0x18] = 0x30 起 96 字节定长块（时间戳/seq/flags）
webmsg_layout:
  vftable_symbol: "CRTX::WebMsg::vftable"
  id_string_offsets: [0x10, 0x14, 0x18, 0x1c]   # 4×std::string(经 FUN_00717757 赋值)；语义未定，待动态确认
  sub_objects:                                   # 深度嵌套解析对象（正文可能在其一，需动态确认）
    - { off: 0x20, type: "CRTX::MsgReceiver" }
    - { off: 0x24, type: "CRTX::SubOpenMsg" }
    - { off: 0x28, type: "CRTX::WebMsgExtInfo" }
  fixed_block_offset: 0x30                        # 起 96 字节定长块（时间戳/seq/flags）
  verified: false

# 裸 RVA 兜底（每次小版本几乎必失效）。
symbols: {}

